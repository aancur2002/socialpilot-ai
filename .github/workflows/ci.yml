name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: socialpilot
          POSTGRES_PASSWORD: socialpilot
          POSTGRES_DB: socialpilot_test
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U socialpilot -d socialpilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql://socialpilot:socialpilot@localhost:5434/socialpilot_test?schema=public
      TEST_REDIS_URL: redis://localhost:6380/1
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

  docker:
    name: Production images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api, worker and web
        run: |
          for target in api worker web; do
            docker build -f infra/docker/Dockerfile --target "$target" -t "socialpilot-$target:ci" .
          done
